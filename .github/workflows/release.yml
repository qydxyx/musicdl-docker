name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-binary:
    name: Binary (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos
            arch: aarch64
            qemu: false
          - os: macos-13
            platform: macos
            arch: x86_64
            qemu: false
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
            qemu: false
          - os: ubuntu-22.04
            platform: linux
            arch: aarch64
            qemu: true

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (Linux aarch64)
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build in ARM64 Docker Container (Linux aarch64)
        if: matrix.qemu
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}":/workspace -w /workspace \
            python:3.11-slim-bookworm bash -c "
              apt-get update && apt-get install -y binutils gcc g++ &&
              pip install --no-cache-dir -r requirements.txt pyinstaller &&
              pyinstaller musicdl-web.spec &&
              cd dist && tar -czf musicdl-web-linux-aarch64.tar.gz musicdl-web
            "

      - name: Set up Python 3.11 (Native runners)
        if: "!matrix.qemu"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (Native runners)
        if: "!matrix.qemu"
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build single-file binary with PyInstaller (Native runners)
        if: "!matrix.qemu"
        run: |
          pyinstaller musicdl-web.spec
          cd dist
          tar -czf "musicdl-web-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" musicdl-web

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/musicdl-web-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker:
    name: Docker Multi-Arch Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
