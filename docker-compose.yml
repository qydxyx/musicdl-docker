services:
  musicdl-web:
    image: ${MUSICDL_IMAGE:-ghcr.io/qydxyx/musicdl-docker:latest}
    pull_policy: ${PULL_POLICY:-always}
    container_name: musicdl-web
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ${DOWNLOADS_DIR:-./downloads}:/app/downloads
      - ./data:/app/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - HOST=0.0.0.0
      - PORT=8080
      - MUSICDL_DATA_DIR=/app/data
      - MUSICDL_DOWNLOAD_DIR=/app/downloads
